name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The end-to-end tests drive the real git binary and run CI jobs with
      # the shell executor; git is all they need. The jj test is skipped
      # unless jj is installed.
      - name: Test
        run: go test ./... -race
